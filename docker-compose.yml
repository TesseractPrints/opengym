name: opengym

services:
  # Passkey auth + per-user data (Node, no framework).
  # image: prebuilt (docker compose pull). build: from source (docker compose up --build).
  opengym-api:
    image: ghcr.io/tesseractprints/opengym-api:latest
    build: ./api
    restart: unless-stopped
    user: "1000:1000"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=3000            # internal port (nginx proxies here) — do not change
      - DATA_DIR=/data
      - COACH_DISABLED=${COACH_DISABLED:-1}
      - INVITE_ONLY=${INVITE_ONLY:-1}
    volumes:
      - ./data:/data         # users, passkeys, per-user state, session secret — BACK THIS UP

  # Text-only React frontend; no third-party exercise images or GIFs are fetched.
  opengym-web:
    image: ghcr.io/tesseractprints/opengym-web:latest
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_EXERCISE_MEDIA: disabled
        VITE_SOURCE_URL: https://github.com/TesseractPrints/opengym
    restart: unless-stopped
    depends_on:
      opengym-api:
        condition: service_started
    ports:
      - "${WEB_PORT:-8080}:8080"
